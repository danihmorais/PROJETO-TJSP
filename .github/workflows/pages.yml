name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test frontend/backend contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure API endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import json, os

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'const CONFIGURED_API_URL='
          value = json.dumps(os.environ['API_URL'])
          start = text.index(marker)
          end = text.index(';', start) + 1
          text = text[:start] + marker + value + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
