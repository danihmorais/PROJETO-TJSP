name: Deploy FastAPI to Ubuntu

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-fastapi"
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Validate application import
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "from app.main import app; print(app.title)"

  deploy:
    name: Deploy backend to shared Ubuntu server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Ubuntu deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_URL: ${{ secrets.API_URL }}/deploy
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PROJECT: PROJETO-TJSP
        run: |
          set -euo pipefail

          test -n "$WEBHOOK_SECRET" || { echo 'Secret DEPLOY_WEBHOOK_SECRET não configurado.'; exit 1; }
          test -n "$DEPLOY_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }

          body=$(jq -nc \
            --arg ref 'refs/heads/main' \
            --arg after "$SHA" \
            --arg repository "$REPOSITORY" \
            --arg project "$PROJECT" \
            '{ref:$ref,after:$after,repository:{full_name:$repository},project:$project}')

          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOY_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Deploy-Project: $PROJECT" \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data "$body")

          echo "Deploy server respondeu: $response"

      - name: Wait for deployment
        env:
          STATUS_URL: ${{ secrets.API_URL }}/deploy-status
          SHA: ${{ github.sha }}
          PROJECT: PROJETO-TJSP
        run: |
          set -euo pipefail

          test -n "$STATUS_URL" || { echo 'Secret API_URL não configurado.'; exit 1; }

          for i in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              --get \
              --url "$STATUS_URL" \
              --data-urlencode "sha=$SHA" \
              --data-urlencode "project=$PROJECT")

            echo "[$i/60] $response"

            state=$(printf '%s' "$response" | jq -r '.state')

            if [ "$state" = "success" ]; then
              echo "Deploy do $PROJECT concluído com sucesso."
              exit 0
            fi

            if [ "$state" = "failure" ]; then
              echo "Deploy do $PROJECT falhou."
              exit 1
            fi

            sleep 10
          done

          echo "Timeout aguardando o deploy de $PROJECT."
          exit 1
